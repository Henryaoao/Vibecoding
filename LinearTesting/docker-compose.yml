services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: ${MYSQL_CONTAINER_NAME:-aoa_auth_mysql}
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: ${BACKEND_CONTAINER_NAME:-aoa_auth_backend}
    environment:
      APP_ENV: "${APP_ENV:-development}"
      APP_PORT: "${BACKEND_CONTAINER_PORT:-8080}"
      AUTH_TOKEN_SECRET: "${AUTH_TOKEN_SECRET}"
      DATABASE_URL: "${DATABASE_URL}"
    ports:
      - "${BACKEND_HOST_PORT:-8080}:${BACKEND_CONTAINER_PORT:-8080}"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ${FRONTEND_CONTAINER_NAME:-aoa_auth_frontend}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - backend

  phpmyadmin:
    image: ${PHPMYADMIN_IMAGE:-phpmyadmin:5.2}
    container_name: ${PHPMYADMIN_CONTAINER_NAME:-aoa_auth_phpmyadmin}
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "${PHPMYADMIN_HOST_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
