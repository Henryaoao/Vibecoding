<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | AoAo Pet</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-panel" aria-labelledby="login-title">
        <div class="auth-art" aria-hidden="true">
          <div class="brand-lockup">
            <span class="brand-mark">AO</span>
            <div>
              <p class="brand-name">AoAo Pet</p>
              <p class="brand-subtitle">Team energy garden</p>
            </div>
          </div>
          <div class="pet-card">
            <div class="pet-visual">
              <span class="pet-shadow"></span>
              <span class="pet-ear pet-ear-left"></span>
              <span class="pet-ear pet-ear-right"></span>
              <span class="pet-body"></span>
              <span class="pet-face">
                <span class="pet-eye"></span>
                <span class="pet-eye"></span>
              </span>
              <span class="pet-mouth"></span>
            </div>
            <span class="pet-badge">Level 1 buddy waiting for breakfast</span>
          </div>
          <p class="auth-copy">
            Finish daily work rituals, collect energy, and grow one cheerful mascot with the whole team.
          </p>
        </div>
        <div class="auth-content">
          <p class="eyebrow">Welcome back</p>
          <h1 id="login-title">Log in to feed the team pet</h1>
          <p class="lead">Your mascot is keeping a tiny seat warm on the dashboard.</p>
          <form class="form-stack" data-login-form>
            <label>
              Email
              <input name="email" type="email" autocomplete="email" required />
            </label>
            <label>
              Password
              <input name="password" type="password" autocomplete="current-password" required />
            </label>
            <p class="error-message" data-error role="alert" hidden></p>
            <button type="submit" data-loading-button>Log in</button>
          </form>
          <p class="helper-text">
            Need an account? <a href="/register.html">Register</a>
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
