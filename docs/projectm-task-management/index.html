<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProjectM Task Management</title>
  <style>
    :root{--bg:#f6f7f9;--panel:#fff;--text:#202124;--muted:#667085;--line:#dde3ea;--soft:#f0f3f6;--ok:#1f8f5f;--plan:#315c9f;--pending:#a15c00;--danger:#b42318;--partial:#7a4cc2;--shadow:0 1px 2px rgba(15,23,42,.06)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
    header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .header-inner{max-width:1500px;margin:0 auto;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:18px}
    h1{margin:0;font-size:22px;letter-spacing:0}
    .subtitle{margin-top:3px;color:var(--muted);font-size:13px}
    .toolbar{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px}
    input,textarea,select,button{font:inherit}
    input[type="search"],input[type="text"],textarea,select{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}
    input[type="search"]{width:min(420px,38vw);padding:9px 11px}
    button{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);padding:9px 11px;cursor:pointer}
    button:hover{background:var(--soft)}
    button.primary{background:#202124;color:#fff;border-color:#202124}
    button.primary:hover{background:#35373a}
    button.danger{color:var(--danger)}
    main{max-width:1500px;margin:0 auto;padding:18px 22px 42px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px}
    aside{position:sticky;top:82px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
    .side-title{padding:12px 14px;color:var(--muted);font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
    .milestone-button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;text-align:left;border:0;border-bottom:1px solid #edf1f5;border-radius:0;padding:11px 14px;background:#fff}
    .milestone-button.active{background:#eef3ff;color:#183b78;font-weight:700}
    .milestone-button small{color:var(--muted);white-space:nowrap;font-weight:500}
    .summary-strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-bottom:12px}
    .metric,.panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
    .metric{padding:12px 14px}
    .metric strong{display:block;font-size:22px;line-height:1.1}
    .metric span{color:var(--muted);font-size:13px}
    .panel-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .panel-head h2{margin:0;font-size:18px;letter-spacing:0}
    .panel-head p{margin:5px 0 0;color:var(--muted);font-size:14px}
    .badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;min-width:0}
    .badge{display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);padding:3px 8px;font-size:12px;white-space:nowrap}
    .badge.created,.badge.done,.badge.aligned{color:var(--ok);background:#effaf3;border-color:#b7e1c8}
    .badge.planned{color:var(--plan);background:#f2f7ff;border-color:#bbd2f2}
    .badge.pending,.badge.not_done,.badge.missing_backend,.badge.missing_frontend{color:var(--pending);background:#fff8e8;border-color:#f4d28f}
    .badge.partial{color:var(--partial);background:#f6f1ff;border-color:#d5c2fb}
    .task-list{padding:0}
    .module-layout{display:grid;grid-template-columns:repeat(2,minmax(360px,1fr));gap:0;border-top:1px solid #edf1f5}
    .module-column:first-child{border-right:1px solid #edf1f5}
    .module-column-head{padding:12px 16px;background:#fafbfc;border-bottom:1px solid #edf1f5}
    .module-column-head h3{margin:0;font-size:14px}
    .module-column-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
    details.task{border-bottom:1px solid #edf1f5;background:#fff}
    details.task:last-child{border-bottom:0}
    summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:9px;align-items:start}
    summary::-webkit-details-marker{display:none}
    summary:hover{background:#fafbfc}
    .task-title{display:grid;grid-template-columns:18px auto minmax(0,1fr);align-items:center;min-width:0;gap:9px;font-weight:700}
    .task-title span:last-child{min-width:0;overflow-wrap:anywhere;word-break:break-word}
    .chevron{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:var(--muted);flex:0 0 auto}
    details[open] .chevron{transform:rotate(90deg)}
    .task-code{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
    summary>.badges{justify-content:flex-start;padding-left:27px}
    .task-editor{padding:0 16px 16px 43px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .field{border:1px solid #edf1f5;border-radius:7px;padding:10px 12px;background:#fcfdff}
    .field.full{grid-column:1/-1}
    label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
    .field input,.field textarea,.field select{width:100%;padding:8px 9px}
    textarea{min-height:92px;resize:vertical}
    .editor-actions{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;align-items:center}
    .save-note{color:var(--muted);font-size:13px}
    .empty{padding:24px;text-align:center;color:var(--muted)}
    @media(max-width:1300px){.summary-strip{grid-template-columns:repeat(4,minmax(0,1fr))}.module-layout{grid-template-columns:1fr}.module-column:first-child{border-right:0}.module-column+.module-column{border-top:1px solid #edf1f5}}
    @media(max-width:900px){.header-inner{align-items:flex-start;flex-direction:column}.toolbar{justify-content:flex-start;width:100%}input[type="search"]{width:100%}main{grid-template-columns:1fr;padding:14px}aside{position:static}.summary-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.task-editor{grid-template-columns:1fr;padding-left:16px}.panel-head{flex-direction:column}.badges{justify-content:flex-start}summary{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="header-inner"><div><h1>ProjectM 任务管理</h1><div id="subtitle" class="subtitle">localhost 本地任务拆分台：数据来自 tasks.json，保存会写回 JSON。</div></div><div class="toolbar"><input id="search" type="search" placeholder="搜索模块、任务、状态、权限、验收..." /><button id="saveAll" class="primary" type="button">保存</button><button id="exportJson" type="button">导出 JSON</button><button id="resetLocal" class="danger" type="button">重置本地修改</button></div></div></header>
  <main><aside><div class="side-title">Modules</div><div id="milestoneNav"></div></aside><section><div id="summary"></div><div class="panel"><div class="panel-head"><div><h2 id="activeTitle"></h2><p id="activeGoal"></p></div><div class="badges" id="activeBadges"></div></div><div class="task-list" id="taskList"></div></div></section></main>
  <script src="./tasks-data.js"></script>
  <script>
    const isStaticFile = location.protocol === "file:";
    const apiUrl = isStaticFile ? null : "/api/tasks";
    const backupKey = "projectm-task-management-backup";
    let data = null;
    let activeModuleId = "";
    let activeMilestoneCode = "01";
    let dirty = false;
    const milestoneNav = document.getElementById("milestoneNav");
    const taskList = document.getElementById("taskList");
    const summary = document.getElementById("summary");
    const activeTitle = document.getElementById("activeTitle");
    const activeGoal = document.getElementById("activeGoal");
    const activeBadges = document.getElementById("activeBadges");
    const subtitle = document.getElementById("subtitle");
    const search = document.getElementById("search");

    boot();

    async function boot(){
      showLoading();
      try{
        data = await loadData();
        activeModuleId = getModules()[0]?.id || "";
        activeMilestoneCode = data.milestones[0]?.code || "01";
        dirty = false;
        render();
      }catch(error){
        showFatal(error);
      }
    }

    async function loadData(){
      if(isStaticFile){
        const backup = readBackup();
        if(backup)return JSON.parse(backup);
        if(window.PROJECTM_TASKS)return cloneData(window.PROJECTM_TASKS);
        throw new Error("静态数据快照 tasks-data.js 未加载。");
      }
      const response = await fetch(apiUrl,{headers:{"Accept":"application/json"}});
      if(!response.ok) throw new Error("读取 tasks.json 失败："+response.status+" "+response.statusText);
      return response.json();
    }

    async function persist(){
      if(!data)return;
      updateSummaries();
      if(isStaticFile){
        if(!writeBackup(JSON.stringify(data))){
          dirty=false;
          render();
          alert("当前浏览器禁止 file:// 页面使用 localStorage，修改无法暂存。请使用“导出 JSON”保存当前数据，或用 localhost 打开后写回 tasks.json。");
          return;
        }
        dirty=false;
        render();
        flashSave("已保存到浏览器");
        return;
      }
      try{
        const response = await fetch(apiUrl,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data,null,2)});
        if(!response.ok) throw new Error(await response.text() || response.statusText);
        removeBackup();
        dirty=false;
        render();
        flashSave("已保存到 tasks.json");
      }catch(error){
        console.error(error);
        const backedUp=writeBackup(JSON.stringify(data));
        alert(backedUp?"保存到 JSON 失败，已临时备份到浏览器 localStorage。请确认是用 node server.mjs 启动 localhost。":"保存到 JSON 失败，且当前浏览器禁止 localStorage 备份。请先导出 JSON。");
      }
    }

    function showLoading(){
      summary.innerHTML='<div class="summary-strip">'+metric("...","Loading")+'</div>';
      activeTitle.textContent="正在读取 tasks.json";
      activeGoal.textContent="请使用 localhost 打开此页面。";
      activeBadges.innerHTML="";
      taskList.innerHTML='<div class="empty">Loading...</div>';
    }

    function showFatal(error){
      console.error(error);
      summary.innerHTML="";
      milestoneNav.innerHTML="";
      activeTitle.textContent="没有加载出来";
      activeGoal.textContent=isStaticFile?"静态数据快照没有加载成功，请确认 tasks-data.js 与 index.html 在同一目录。":"请在 docs/projectm-task-management 目录运行 node server.mjs，然后打开 http://localhost:8000/";
      activeBadges.innerHTML=badge("load failed","pending");
      taskList.innerHTML='<div class="empty">'+escapeHtml(error.message || error)+'</div>';
    }

    function flashSave(text){
      const button=document.getElementById("saveAll");
      button.textContent=text;
      setTimeout(()=>{button.textContent=dirty?"保存 *":"保存"},1400);
    }

    function updateSummaries(){
      for(const milestone of data.milestones){
        for(const group of milestone.groups||[]){
          const children=group.children||[];
          group.statusSummary={created:children.filter(t=>t.status==="created").length,planned:children.filter(t=>t.status==="planned").length,pending:children.filter(t=>t.status==="pending").length,total:children.length};
          group.completionSummary=completionSummary(children);
        }
        const tasks=flattenMilestone(milestone).map(row=>row.task);
        milestone.statusSummary={created:tasks.filter(t=>t.status==="created").length,planned:tasks.filter(t=>t.status==="planned").length,pending:tasks.filter(t=>t.status==="pending").length,total:tasks.length};
        milestone.completionSummary=completionSummary(tasks);
      }
    }

    function render(){
      updateSummaries();
      subtitle.textContent=isStaticFile?"静态模块视图：数据来自 tasks-data.js；若浏览器禁止本地暂存，请用“导出 JSON”保存修改。":"localhost 模块任务板：数据来自 tasks.json，保存会写回 JSON。";
      const allTasks=getAllRows().map(row=>row.task);
      const modules=getModules();
      const completion=completionSummary(allTasks);
      const alignment=alignmentSummary(allTasks);
      summary.innerHTML='<div class="summary-strip">'+metric(modules.length || data.milestones.length,modules.length?"Modules":"Milestones")+metric(allTasks.length,"Tasks")+metric(countSide("web_frontend"),"Web tasks")+metric(countSide("backend_api"),"Backend tasks")+metric(alignment.aligned,"已对齐")+metric(alignment.partial,"部分")+metric(alignment.missing_backend,"缺后端")+metric(alignment.missing_frontend,"缺前端")+'</div>';
      if(modules.length){
        syncActiveModuleToSearch();
        renderModuleNav();
        renderActiveModule();
      }else{
        renderMilestones();
        renderActiveMilestone();
      }
      document.getElementById("saveAll").textContent=dirty?"保存 *":"保存";
    }

    function syncActiveModuleToSearch(){
      const q=normalize(search.value.trim());
      if(!q)return;
      const modules=getModules();
      const active=modules.find(item=>item.id===activeModuleId);
      if(active&&getModuleRows(active).some(row=>matches(row,q)))return;
      const next=modules.find(mod=>getModuleRows(mod).some(row=>matches(row,q)));
      if(next)activeModuleId=next.id;
    }

    function renderModuleNav(){
      milestoneNav.innerHTML="";
      const q=normalize(search.value.trim());
      for(const mod of getModules()){
        const rows=getModuleRows(mod).filter(row=>matches(row,q));
        const counts=moduleCounts(mod);
        const button=document.createElement("button");
        button.type="button";
        button.className="milestone-button"+(mod.id===activeModuleId?" active":"");
        button.innerHTML='<span>'+escapeHtml(mod.name)+'</span><small>'+rows.length+'/'+counts.total+'</small>';
        button.addEventListener("click",()=>{activeModuleId=mod.id;render()});
        milestoneNav.appendChild(button);
      }
    }

    function renderActiveModule(){
      const modules=getModules();
      const mod=modules.find(item=>item.id===activeModuleId)||modules[0];
      if(!mod)return;
      activeModuleId=mod.id;
      const q=normalize(search.value.trim());
      const webRows=(mod.frontendTasks||[]).map(findTaskRow).filter(Boolean).filter(row=>matches(row,q));
      const backendRows=(mod.backendTasks||[]).map(findTaskRow).filter(Boolean).filter(row=>matches(row,q));
      const counts=moduleCounts(mod);
      activeTitle.textContent=mod.name;
      activeGoal.textContent=mod.purpose || "";
      activeBadges.innerHTML=badge(counts.frontend+" Web","planned")+badge(counts.backend+" Backend","planned")+badge(counts.aligned+" 已对齐","aligned")+badge(counts.partial+" 部分","partial")+badge(counts.missing_backend+" 缺后端","missing_backend")+badge(counts.missing_frontend+" 缺前端","missing_frontend");
      taskList.innerHTML='<div class="module-layout"><div class="module-column"><div class="module-column-head"><h3>Web tasks</h3><p>05 前端门户与后台开发</p></div><div id="webTasks"></div></div><div class="module-column"><div class="module-column-head"><h3>Backend tasks</h3><p>06 后端 API 开发</p></div><div id="backendTasks"></div></div></div>';
      renderRowsInto(document.getElementById("webTasks"),webRows,"当前模块没有匹配搜索条件的 Web task。");
      renderRowsInto(document.getElementById("backendTasks"),backendRows,"当前模块没有匹配搜索条件的 Backend task。");
    }

    function renderRowsInto(container,rows,emptyText){
      container.innerHTML="";
      if(!rows.length){
        container.innerHTML='<div class="empty">'+escapeHtml(emptyText)+'</div>';
        return;
      }
      for(const row of rows)container.appendChild(renderTask(row));
    }

    function renderMilestones(){
      milestoneNav.innerHTML="";
      const q=normalize(search.value.trim());
      for(const milestone of data.milestones){
        const visibleCount=flattenMilestone(milestone).filter(row=>matches(row,q)).length;
        const button=document.createElement("button");
        button.type="button";
        button.className="milestone-button"+(milestone.code===activeMilestoneCode?" active":"");
        button.innerHTML='<span>'+escapeHtml(milestone.name)+'</span><small>'+visibleCount+'/'+milestone.statusSummary.total+'</small>';
        button.addEventListener("click",()=>{activeMilestoneCode=milestone.code;render()});
        milestoneNav.appendChild(button);
      }
    }

    function renderActiveMilestone(){
      const milestone=data.milestones.find(item=>item.code===activeMilestoneCode)||data.milestones[0];
      if(!milestone)return;
      const q=normalize(search.value.trim());
      const rows=flattenMilestone(milestone).filter(row=>matches(row,q));
      activeTitle.textContent=milestone.name;
      activeGoal.textContent=milestone.goal;
      activeBadges.innerHTML=badge(milestone.statusSummary.created+" 已确认","created")+badge(milestone.statusSummary.planned+" 已拆分","planned")+badge(milestone.statusSummary.pending+" 待拆分","pending")+badge(milestone.completionSummary.done+" 已做","done")+badge(milestone.completionSummary.partial+" 部分","partial")+badge(milestone.completionSummary.not_done+" 未做","not_done");
      renderRowsInto(taskList,rows,"当前 milestone 没有匹配搜索条件的任务。");
    }

    function renderTask(row){
      const task=row.task;
      const details=document.createElement("details");
      details.className="task";
      details.innerHTML='<summary><span class="task-title"><span class="chevron">›</span><span class="task-code">'+escapeHtml(task.code)+'</span><span>'+escapeHtml(task.title)+'</span></span><span class="badges">'+badge(row.group.code,"")+badge(statusLabel(task.status),task.status)+badge(completionLabel(task.completionStatus),task.completionStatus||"not_done")+(task.alignmentModule?badge(task.alignmentModule.name,"planned"):"")+(task.alignmentStatus?badge(alignmentLabel(task.alignmentStatus),task.alignmentStatus):"")+'</span></summary>'+editorHtml(task);
      details.querySelectorAll("[data-field]").forEach(input=>{
        input.addEventListener("input",()=>updateTaskFromEditor(task,details));
        input.addEventListener("change",()=>updateTaskFromEditor(task,details));
      });
      details.querySelector("[data-action='save']").addEventListener("click",persist);
      details.querySelector("[data-action='duplicate']").addEventListener("click",()=>duplicateTask(row.group,task));
      return details;
    }

    function editorHtml(task){
      const saveNote=isStaticFile?"修改后点击保存，会暂存到当前浏览器。":"修改后点击保存，会写回 tasks.json。";
      return '<div class="task-editor">'+field("拆分状态",'<select data-field="status"><option value="created" '+selected(task.status,"created")+'>已确认</option><option value="planned" '+selected(task.status,"planned")+'>已拆分</option><option value="pending" '+selected(task.status,"pending")+'>待拆分</option></select>')+field("完成状态",'<select data-field="completionStatus"><option value="done" '+selected(task.completionStatus,"done")+'>已做</option><option value="partial" '+selected(task.completionStatus,"partial")+'>部分完成</option><option value="not_done" '+selected(task.completionStatus||"not_done","not_done")+'>未做</option></select>')+field("对齐状态",'<select data-field="alignmentStatus"><option value="" '+selected(task.alignmentStatus||"","")+'>无</option><option value="aligned" '+selected(task.alignmentStatus,"aligned")+'>已对齐</option><option value="partial" '+selected(task.alignmentStatus,"partial")+'>部分对齐</option><option value="missing_backend" '+selected(task.alignmentStatus,"missing_backend")+'>缺后端</option><option value="missing_frontend" '+selected(task.alignmentStatus,"missing_frontend")+'>缺前端</option></select>')+field("对齐模块",'<input type="text" value="'+escapeAttr(moduleLabel(task))+'" readonly />')+field("外部任务 ID（可选）",'<input data-field="linearId" type="text" value="'+escapeAttr(task.linearId||"")+'" placeholder="例如 AOA-409" />')+field("任务编号",'<input data-field="code" type="text" value="'+escapeAttr(task.code)+'" />')+field("标题",'<input data-field="title" type="text" value="'+escapeAttr(task.title)+'" />')+field("完成依据",'<textarea data-field="completionNote">'+escapeHtml(task.completionNote||"")+'</textarea>',true)+field("前后端对齐说明",'<textarea data-field="alignmentNote">'+escapeHtml(task.alignmentNote||"")+'</textarea>',true)+field("合同链接",'<textarea data-field="contractLinks">'+escapeHtml(linksToText(task.contractLinks))+'</textarea>',true)+field("目标",'<textarea data-field="goal">'+escapeHtml(task.goal||"")+'</textarea>',true)+field("范围",'<textarea data-field="scope">'+escapeHtml(arrayToText(task.scope))+'</textarea>')+field("权限与边界",'<textarea data-field="boundary">'+escapeHtml(task.boundary||"")+'</textarea>')+field("验收标准",'<textarea data-field="acceptance">'+escapeHtml(arrayToText(task.acceptance))+'</textarea>')+field("验证证据",'<textarea data-field="evidence">'+escapeHtml(arrayToText(task.evidence))+'</textarea>')+field("完成证据",'<textarea data-field="completionEvidence">'+escapeHtml(arrayToText(task.completionEvidence))+'</textarea>')+'<div class="editor-actions"><span class="save-note">'+escapeHtml(saveNote)+'</span><span><button type="button" data-action="duplicate">复制任务</button> <button type="button" class="primary" data-action="save">保存</button></span></div></div>';
    }

    function updateTaskFromEditor(task,root){
      for(const input of root.querySelectorAll("[data-field]")){
        const fieldName=input.dataset.field;
        if(["scope","acceptance","evidence","completionEvidence"].includes(fieldName))task[fieldName]=textToArray(input.value);
        else if(fieldName==="contractLinks")task[fieldName]=textToLinks(input.value);
        else task[fieldName]=input.value.trim();
        if(fieldName==="linearId"&&!task[fieldName])task[fieldName]=null;
        if(fieldName==="alignmentStatus"&&!task[fieldName])delete task[fieldName];
      }
      dirty=true;
      document.getElementById("saveAll").textContent="保存 *";
    }

    function duplicateTask(group,task){
      const copy=cloneData(task);
      copy.linearId=null;
      copy.status="pending";
      copy.code=nextCode(group,task.code);
      copy.title=copy.title+" Copy";
      group.children.push(copy);
      dirty=true;
      render();
    }

    function getModules(){return data?.alignmentAudit?.modules||data?.moduleAlignmentAudit?.modules||[]}
    function getAllRows(){return data.milestones.flatMap(flattenMilestone)}
    function flattenMilestone(milestone){const rows=[];for(const group of milestone.groups||[])for(const task of group.children||[])rows.push({milestone,group,task});return rows}
    function findTaskRow(code){return getAllRows().find(row=>row.task.code===code)}
    function getModuleRows(mod){return [...(mod.frontendTasks||[]),...(mod.backendTasks||[])].map(findTaskRow).filter(Boolean)}
    function moduleCounts(mod){const rows=getModuleRows(mod);return {...alignmentSummary(rows.map(row=>row.task)),frontend:(mod.frontendTasks||[]).length,backend:(mod.backendTasks||[]).length,total:rows.length}}
    function countSide(side){return getAllRows().filter(row=>row.task.alignmentModule?.side===side).length}
    function alignmentSummary(tasks){return {aligned:tasks.filter(t=>t.alignmentStatus==="aligned").length,partial:tasks.filter(t=>t.alignmentStatus==="partial").length,missing_backend:tasks.filter(t=>t.alignmentStatus==="missing_backend").length,missing_frontend:tasks.filter(t=>t.alignmentStatus==="missing_frontend").length,total:tasks.length}}
    function nextCode(group,code){const base=String(code).replace(/\d+$/,'');const nums=(group.children||[]).map(t=>String(t.code).match(/(\d+)$/)).filter(Boolean).map(m=>Number(m[1]));return base+(Math.max(0,...nums)+1)}
    function matches(row,q){if(!q)return true;return normalize([row.milestone.name,row.group.code,row.group.title,row.task.linearId,row.task.status,row.task.completionStatus,row.task.completionNote,row.task.alignmentStatus,row.task.alignmentNote,moduleLabel(row.task),linksToText(row.task.contractLinks),row.task.code,row.task.title,row.task.goal,row.task.boundary,...(row.task.scope||[]),...(row.task.acceptance||[]),...(row.task.evidence||[]),...(row.task.completionEvidence||[])].join(" ")).includes(q)}
    function metric(value,title){return '<div class="metric"><strong>'+escapeHtml(value)+'</strong><span>'+escapeHtml(title)+'</span></div>'}
    function badge(text,kind){return '<span class="badge '+escapeAttr(kind||"")+'">'+escapeHtml(text)+'</span>'}
    function field(labelText,html,full){return '<div class="field '+(full?"full":"")+'"><label>'+escapeHtml(labelText)+'</label>'+html+'</div>'}
    function selected(value,target){return value===target?"selected":""}
    function statusLabel(status){return status==="created"?"已确认":status==="planned"?"已拆分":"待拆分"}
    function completionLabel(status){return status==="done"?"已做":status==="partial"?"部分完成":"未做"}
    function alignmentLabel(status){return status==="aligned"?"已对齐":status==="partial"?"部分对齐":status==="missing_backend"?"缺后端":status==="missing_frontend"?"缺前端":"未映射"}
    function completionSummary(tasks){return {done:tasks.filter(t=>t.completionStatus==="done").length,partial:tasks.filter(t=>t.completionStatus==="partial").length,not_done:tasks.filter(t=>(t.completionStatus||"not_done")==="not_done").length,total:tasks.length}}
    function moduleLabel(task){return task.alignmentModule?[task.alignmentModule.id,task.alignmentModule.name].filter(Boolean).join(" | "):""}
    function linksToText(value){return Array.isArray(value)?value.map(item=>[item.code,item.endpoint,item.note].filter(Boolean).join(" | ")).join("\n"):""}
    function textToLinks(value){return value.split("\n").map(item=>item.trim()).filter(Boolean).map(line=>{const parts=line.split("|").map(part=>part.trim()).filter(Boolean);return {code:parts[0]||"",endpoint:parts[1]||undefined,note:parts[2]||undefined}})}
    function arrayToText(value){return Array.isArray(value)?value.join("\n"):(value||"")}
    function textToArray(value){return value.split("\n").map(item=>item.trim()).filter(Boolean)}
    function cloneData(value){return JSON.parse(JSON.stringify(value))}
    function normalize(value){return String(value||"").toLowerCase()}
    function escapeHtml(value){return String(value??"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]))}
    function escapeAttr(value){return escapeHtml(value)}
    function readBackup(){try{return window.localStorage?.getItem(backupKey)||null}catch(error){return null}}
    function writeBackup(value){try{window.localStorage?.setItem(backupKey,value);return true}catch(error){return false}}
    function removeBackup(){try{window.localStorage?.removeItem(backupKey)}catch(error){}}

    search.addEventListener("input",()=>{if(data)render()});
    document.getElementById("saveAll").addEventListener("click",persist);
    document.getElementById("resetLocal").addEventListener("click",async()=>{const source=isStaticFile?"tasks-data.js 静态快照":"tasks.json";if(!confirm("确认丢弃当前页面修改，重新读取 "+source+"？"))return;removeBackup();await boot()});
    document.getElementById("exportJson").addEventListener("click",()=>{if(!data)return;updateSummaries();const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="projectm-task-management.json";a.click();URL.revokeObjectURL(url)});
  </script>
</body>
</html>
