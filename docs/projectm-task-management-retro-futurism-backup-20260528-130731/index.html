<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProjectM Task Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a1a2e'/%3E%3Crect x='2' y='3' width='12' height='9' fill='none' stroke='%2300ffff' stroke-width='2'/%3E%3Crect x='4' y='6' width='3' height='2' fill='%23ff006e'/%3E%3Crect x='9' y='6' width='3' height='2' fill='%230080ff'/%3E%3Crect x='5' y='11' width='6' height='2' fill='%23ffb703'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{
      --void:#090a18;
      --midnight:#1a1a2e;
      --panel:#121729;
      --panel-2:#171b35;
      --panel-3:#0c1224;
      --grid:#263a74;
      --blue:#0080ff;
      --cyan:#00ffff;
      --pink:#ff006e;
      --purple:#5d34d0;
      --amber:#ffb703;
      --green:#53ffb1;
      --danger:#ff4d8d;
      --text:#eef7ff;
      --muted:#9aa7c7;
      --line:rgba(0,255,255,.76);
      --line-soft:rgba(0,128,255,.34);
      --shadow-blue:0 0 10px rgba(0,128,255,.85),0 0 24px rgba(0,128,255,.45),inset 0 0 18px rgba(0,128,255,.12);
      --shadow-cyan:0 0 10px rgba(0,255,255,.85),0 0 24px rgba(0,255,255,.35),inset 0 0 18px rgba(0,255,255,.1);
      --shadow-pink:0 0 10px rgba(255,0,110,.82),0 0 24px rgba(255,0,110,.38),inset 0 0 18px rgba(255,0,110,.12);
      --font-pixel:"Press Start 2P","Courier New","Microsoft YaHei",monospace;
      --font-body:"Orbitron","Microsoft YaHei","Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--void)}
    body{
      position:relative;
      margin:0;
      min-height:100%;
      background:
        linear-gradient(rgba(0,128,255,.13) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,128,255,.13) 1px,transparent 1px),
        linear-gradient(180deg,#090a18 0%,#1a1a2e 48%,#120b2f 100%);
      background-size:48px 48px,48px 48px,auto;
      color:var(--text);
      font-family:var(--font-body);
      font-size:16px;
      line-height:1.5;
      overflow-x:hidden;
    }
    body::before{
      content:"";
      position:fixed;
      left:-12vw;
      right:-12vw;
      bottom:-2px;
      height:45vh;
      z-index:0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,0,110,.5) 2px,transparent 2px),
        linear-gradient(90deg,rgba(0,255,255,.42) 2px,transparent 2px);
      background-size:100% 34px,64px 100%;
      transform:perspective(420px) rotateX(62deg);
      transform-origin:bottom;
      box-shadow:0 -20px 80px rgba(255,0,110,.2);
    }
    body::after{
      content:"";
      position:fixed;
      inset:0;
      z-index:60;
      pointer-events:none;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.32) 2px,rgba(0,0,0,.32) 4px);
      opacity:.72;
    }
    header,main{position:relative;z-index:1}
    header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(18,23,41,.92);
      border-bottom:2px solid var(--blue);
      box-shadow:var(--shadow-blue);
      backdrop-filter:blur(12px);
    }
    .header-inner{
      max-width:1500px;
      margin:0 auto;
      padding:16px 22px;
      display:grid;
      grid-template-columns:auto minmax(0,1fr) auto;
      align-items:center;
      gap:18px;
    }
    .brand-mark{
      width:60px;
      height:60px;
      border:2px solid var(--cyan);
      border-radius:10px;
      background:linear-gradient(145deg,rgba(0,128,255,.18),rgba(255,0,110,.14)),var(--panel-3);
      box-shadow:var(--shadow-cyan);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }
    .pixel-sprite{
      position:relative;
      width:36px;
      height:24px;
      border:3px solid var(--cyan);
      background:linear-gradient(90deg,rgba(0,255,255,.2),rgba(255,0,110,.18));
      box-shadow:0 0 12px var(--cyan),inset 0 0 12px rgba(0,255,255,.2);
    }
    .pixel-sprite::before{
      content:"";
      position:absolute;
      left:6px;
      top:7px;
      width:6px;
      height:6px;
      background:var(--pink);
      box-shadow:16px 0 0 var(--blue),8px 10px 0 var(--amber);
    }
    h1{
      margin:0;
      color:var(--cyan);
      font-family:var(--font-pixel);
      font-size:clamp(16px,2vw,27px);
      line-height:1.45;
      text-shadow:0 0 10px var(--cyan),0 0 22px rgba(0,255,255,.78),0 0 40px rgba(0,128,255,.65);
    }
    .subtitle{
      margin-top:8px;
      color:var(--muted);
      font-size:13px;
      letter-spacing:.02em;
    }
    .toolbar{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:wrap;
      gap:10px;
    }
    input,textarea,select,button{font:inherit}
    input[type="search"],input[type="text"],textarea,select{
      border:2px solid var(--blue);
      border-radius:8px;
      background:rgba(9,10,24,.76);
      color:var(--cyan);
      box-shadow:var(--shadow-blue);
      outline:none;
    }
    input[type="search"]{
      width:min(420px,36vw);
      min-height:44px;
      padding:10px 13px;
    }
    input::placeholder,textarea::placeholder{color:#637099}
    input:focus,textarea:focus,select:focus,button:focus-visible{
      outline:2px solid var(--pink);
      outline-offset:3px;
      box-shadow:var(--shadow-pink);
    }
    button{
      min-height:44px;
      border:2px solid var(--cyan);
      border-radius:8px;
      background:rgba(0,128,255,.12);
      color:var(--cyan);
      padding:10px 13px;
      cursor:pointer;
      box-shadow:var(--shadow-cyan);
      text-transform:uppercase;
      text-shadow:0 0 9px currentColor;
      transition:transform .12s ease,box-shadow .12s ease,background .12s ease,color .12s ease;
    }
    button:hover{
      background:rgba(0,255,255,.16);
      transform:translateY(-1px);
    }
    button:active{transform:translateY(1px)}
    button.primary{
      border-color:var(--pink);
      color:var(--text);
      background:linear-gradient(90deg,rgba(0,128,255,.72),rgba(255,0,110,.78));
      box-shadow:0 0 18px rgba(0,128,255,.55),0 0 24px rgba(255,0,110,.42);
    }
    button.danger{
      border-color:var(--danger);
      color:#ffd7e7;
      box-shadow:var(--shadow-pink);
    }
    main{
      max-width:1500px;
      margin:0 auto;
      padding:24px 22px 50px;
      display:grid;
      grid-template-columns:310px minmax(0,1fr);
      gap:20px;
    }
    aside{
      position:sticky;
      top:104px;
      align-self:start;
      background:rgba(18,23,41,.82);
      border:2px solid var(--blue);
      border-radius:12px;
      box-shadow:var(--shadow-blue);
      overflow:hidden;
      backdrop-filter:blur(10px);
    }
    .side-title{
      padding:14px 16px;
      color:var(--pink);
      font-family:var(--font-pixel);
      font-size:11px;
      line-height:1.7;
      border-bottom:2px solid var(--blue);
      background:linear-gradient(90deg,rgba(255,0,110,.17),rgba(0,128,255,.1));
      text-shadow:0 0 10px var(--pink),0 0 20px rgba(255,0,110,.65);
    }
    .milestone-button{
      width:100%;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      text-align:left;
      border:0;
      border-bottom:1px solid rgba(0,128,255,.28);
      border-radius:0;
      padding:13px 14px;
      background:rgba(18,23,41,.72);
      color:var(--muted);
      box-shadow:none;
      text-transform:none;
    }
    .milestone-button:last-child{border-bottom:0}
    .milestone-button:hover,.milestone-button.active{
      background:linear-gradient(90deg,rgba(255,0,110,.2),rgba(0,128,255,.16));
      color:var(--text);
      transform:none;
      box-shadow:inset 4px 0 0 var(--pink);
    }
    .milestone-button.active span::before{content:"> "}
    .milestone-button small{
      color:var(--cyan);
      white-space:nowrap;
      font-weight:800;
      font-variant-numeric:tabular-nums;
      text-shadow:0 0 8px var(--cyan);
    }
    .summary-strip{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:12px;
      margin-bottom:16px;
    }
    .metric,.panel{
      background:rgba(18,23,41,.82);
      border:2px solid var(--blue);
      border-radius:12px;
      box-shadow:var(--shadow-blue);
      backdrop-filter:blur(10px);
    }
    .metric{
      min-height:100px;
      padding:15px;
      position:relative;
      overflow:hidden;
    }
    .metric:nth-child(2n){border-color:var(--pink);box-shadow:var(--shadow-pink)}
    .metric:nth-child(3n){border-color:var(--cyan);box-shadow:var(--shadow-cyan)}
    .metric::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg,rgba(0,255,255,.12),transparent 48%,rgba(255,0,110,.12));
      pointer-events:none;
    }
    .metric::after{
      content:"";
      position:absolute;
      left:15px;
      right:15px;
      bottom:13px;
      height:9px;
      border:1px solid rgba(0,255,255,.8);
      background:linear-gradient(90deg,var(--pink) 0 58%,rgba(255,255,255,.08) 58%);
      box-shadow:0 0 10px rgba(255,0,110,.45);
    }
    .metric strong{
      position:relative;
      z-index:1;
      display:block;
      color:var(--cyan);
      font-family:var(--font-pixel);
      font-size:clamp(18px,2vw,26px);
      line-height:1.25;
      text-shadow:0 0 10px var(--cyan),0 0 24px rgba(0,255,255,.55);
    }
    .metric span{
      position:relative;
      z-index:1;
      display:block;
      margin-top:6px;
      color:var(--muted);
      font-size:13px;
    }
    .panel{border-color:var(--line);box-shadow:var(--shadow-cyan)}
    .panel-head{
      padding:18px;
      border-bottom:2px solid rgba(0,255,255,.55);
      background:linear-gradient(90deg,rgba(0,128,255,.18),rgba(255,0,110,.12));
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-start;
    }
    .panel-head h2{
      margin:0;
      color:var(--cyan);
      font-family:var(--font-pixel);
      font-size:clamp(13px,1.25vw,17px);
      line-height:1.8;
      text-shadow:0 0 10px var(--cyan),0 0 24px rgba(0,255,255,.5);
    }
    .panel-head p{
      margin:8px 0 0;
      color:#d7e4ff;
      font-size:14px;
    }
    .badges{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      justify-content:flex-end;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      min-height:28px;
      border-radius:6px;
      border:1px solid rgba(0,255,255,.75);
      background:rgba(0,255,255,.08);
      color:var(--cyan);
      padding:4px 8px;
      font-size:12px;
      line-height:1.3;
      white-space:nowrap;
      box-shadow:0 0 8px rgba(0,255,255,.25);
      text-shadow:0 0 8px currentColor;
    }
    .badge.created{border-color:var(--green);color:var(--green);background:rgba(83,255,177,.1)}
    .badge.planned{border-color:var(--blue);color:#8cc8ff;background:rgba(0,128,255,.13)}
    .badge.pending{border-color:var(--amber);color:var(--amber);background:rgba(255,183,3,.1)}
    .task-list{padding:0}
    details.task{
      border-bottom:1px solid rgba(0,255,255,.28);
      background:rgba(18,23,41,.62);
    }
    details.task:nth-child(2n){background:rgba(31,28,57,.65)}
    details.task:last-child{border-bottom:0}
    summary{
      list-style:none;
      cursor:pointer;
      padding:15px 16px;
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
    }
    summary::-webkit-details-marker{display:none}
    summary:hover{background:linear-gradient(90deg,rgba(0,255,255,.08),rgba(255,0,110,.08))}
    .task-title{
      display:flex;
      align-items:center;
      min-width:0;
      gap:10px;
      color:var(--text);
      font-weight:700;
    }
    .task-title span:last-child{
      min-width:0;
      overflow-wrap:anywhere;
    }
    .chevron{
      width:26px;
      height:26px;
      border:1px solid var(--pink);
      border-radius:6px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,0,110,.12);
      color:var(--pink);
      flex:0 0 auto;
      box-shadow:0 0 10px rgba(255,0,110,.38);
      font-weight:900;
      text-shadow:0 0 8px var(--pink);
    }
    details[open] .chevron{transform:rotate(90deg)}
    .task-code{
      color:var(--pink);
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
      text-shadow:0 0 8px rgba(255,0,110,.75);
    }
    .task-editor{
      padding:0 16px 18px 52px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
      background:rgba(9,10,24,.72);
      border-top:1px solid rgba(0,255,255,.35);
    }
    .field{
      border:1px solid rgba(0,255,255,.62);
      border-radius:10px;
      padding:11px 12px;
      background:rgba(12,18,36,.86);
      box-shadow:0 0 12px rgba(0,128,255,.18),inset 0 0 14px rgba(0,255,255,.06);
    }
    .field.full{grid-column:1/-1}
    label{
      display:block;
      margin-bottom:8px;
      color:var(--pink);
      font-family:var(--font-pixel);
      font-size:9px;
      line-height:1.7;
      text-transform:uppercase;
      text-shadow:0 0 8px rgba(255,0,110,.8);
    }
    .field input,.field textarea,.field select{
      width:100%;
      padding:9px 10px;
      min-height:42px;
    }
    textarea{
      min-height:112px;
      resize:vertical;
    }
    .editor-actions{
      grid-column:1/-1;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      padding-top:4px;
    }
    .editor-actions span:last-child{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:flex-end;
    }
    .save-note{
      color:var(--muted);
      font-size:13px;
    }
    .empty{
      padding:28px;
      text-align:center;
      color:var(--cyan);
      background:rgba(9,10,24,.62);
      text-shadow:0 0 10px rgba(0,255,255,.65);
    }
    @media(max-width:1100px){
      .header-inner{grid-template-columns:auto minmax(0,1fr)}
      .toolbar{grid-column:1/-1;justify-content:flex-start;width:100%}
      input[type="search"]{width:min(560px,100%)}
      .summary-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media(max-width:900px){
      .header-inner{align-items:flex-start}
      main{grid-template-columns:1fr;padding:16px}
      aside{position:static}
      .summary-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
      .task-editor{grid-template-columns:1fr;padding-left:16px}
      .panel-head{flex-direction:column}
      .badges{justify-content:flex-start}
      summary{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      header{position:static}
      .header-inner{display:flex;flex-direction:column}
      .brand-mark{width:50px;height:50px}
      .toolbar{flex-direction:column;align-items:stretch}
      .toolbar button,.toolbar input{width:100%}
      .summary-strip{grid-template-columns:1fr}
      .editor-actions{align-items:stretch;flex-direction:column}
      .editor-actions span:last-child{justify-content:flex-start}
      .task-title{align-items:flex-start}
      .badges{max-width:100%}
      .badge{white-space:normal}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{transition:none!important;animation:none!important}
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-mark" aria-hidden="true"><div class="pixel-sprite"></div></div>
      <div>
        <h1>PROJECTM TASK TERMINAL</h1>
        <div class="subtitle">Retro-futurism localhost 任务管理：数据来自 tasks.json，保存会写回 JSON。</div>
      </div>
      <div class="toolbar">
        <input id="search" type="search" aria-label="搜索任务、状态、权限、验收" placeholder="搜索任务、状态、权限、验收..." />
        <button id="saveAll" class="primary" type="button">SAVE</button>
        <button id="exportJson" type="button">EXPORT JSON</button>
        <button id="resetLocal" class="danger" type="button">RESET</button>
      </div>
    </div>
  </header>
  <main>
    <aside>
      <div class="side-title">MISSION SELECT</div>
      <div id="milestoneNav"></div>
    </aside>
    <section>
      <div id="summary"></div>
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2 id="activeTitle"></h2>
            <p id="activeGoal"></p>
          </div>
          <div class="badges" id="activeBadges"></div>
        </div>
        <div class="task-list" id="taskList"></div>
      </div>
    </section>
  </main>
  <script>
    const apiUrl = "/api/tasks";
    const backupKey = "projectm-task-management-backup";
    let data = null;
    let activeMilestoneCode = "01";
    let dirty = false;
    let fieldIdCounter = 0;
    const milestoneNav = document.getElementById("milestoneNav");
    const taskList = document.getElementById("taskList");
    const summary = document.getElementById("summary");
    const activeTitle = document.getElementById("activeTitle");
    const activeGoal = document.getElementById("activeGoal");
    const activeBadges = document.getElementById("activeBadges");
    const search = document.getElementById("search");

    boot();

    async function boot(){
      showLoading();
      try{
        data = await loadData();
        activeMilestoneCode = (data.milestones[0] && data.milestones[0].code) || "01";
        dirty = false;
        render();
      }catch(error){
        showFatal(error);
      }
    }

    async function loadData(){
      const response = await fetch(apiUrl,{headers:{"Accept":"application/json"}});
      if(!response.ok) throw new Error("读取 tasks.json 失败："+response.status+" "+response.statusText);
      return response.json();
    }

    async function persist(){
      if(!data)return;
      updateSummaries();
      try{
        const response = await fetch(apiUrl,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data,null,2)});
        if(!response.ok) throw new Error(await response.text() || response.statusText);
        localStorage.removeItem(backupKey);
        dirty=false;
        render();
        flashSave("SAVED");
      }catch(error){
        console.error(error);
        localStorage.setItem(backupKey,JSON.stringify(data));
        alert("保存到 JSON 失败，已临时备份到浏览器 localStorage。请确认是用 node server.mjs 启动 localhost。");
      }
    }

    function showLoading(){
      summary.innerHTML='<div class="summary-strip">'+metric("...","Loading")+'</div>';
      activeTitle.textContent="正在读取 tasks.json";
      activeGoal.textContent="请使用 localhost 打开此页面。";
      activeBadges.innerHTML="";
      taskList.innerHTML='<div class="empty">Loading...</div>';
    }

    function showFatal(error){
      console.error(error);
      summary.innerHTML="";
      milestoneNav.innerHTML="";
      activeTitle.textContent="没有加载出来";
      activeGoal.textContent="请在 docs/projectm-task-management 目录运行 node server.mjs，然后打开 http://localhost:8000/";
      activeBadges.innerHTML=badge("load failed","pending");
      taskList.innerHTML='<div class="empty">'+escapeHtml(error.message || error)+'</div>';
    }

    function flashSave(text){
      const button=document.getElementById("saveAll");
      button.textContent=text;
      setTimeout(()=>{button.textContent=dirty?"SAVE *":"SAVE"},1400);
    }

    function updateSummaries(){for(const milestone of data.milestones){for(const group of milestone.groups||[]){const children=group.children||[];group.statusSummary={created:children.filter(t=>t.status==="created").length,planned:children.filter(t=>t.status==="planned").length,pending:children.filter(t=>t.status==="pending").length,total:children.length}}const tasks=flattenMilestone(milestone).map(row=>row.task);milestone.statusSummary={created:tasks.filter(t=>t.status==="created").length,planned:tasks.filter(t=>t.status==="planned").length,pending:tasks.filter(t=>t.status==="pending").length,total:tasks.length}}}
    function render(){updateSummaries();const allTasks=data.milestones.flatMap(m=>flattenMilestone(m).map(row=>row.task));const created=allTasks.filter(t=>t.status==="created").length;const planned=allTasks.filter(t=>t.status==="planned").length;const pending=allTasks.filter(t=>t.status==="pending").length;summary.innerHTML='<div class="summary-strip">'+metric(data.milestones.length,"Milestones")+metric(allTasks.length,"Tasks")+metric(created,"Created")+metric(planned,"Planned")+metric(pending,"Pending")+'</div>';renderMilestones();renderActiveMilestone();document.getElementById("saveAll").textContent=dirty?"SAVE *":"SAVE"}
    function renderMilestones(){milestoneNav.innerHTML="";const q=normalize(search.value.trim());for(const milestone of data.milestones){const visibleCount=flattenMilestone(milestone).filter(row=>matches(row,q)).length;const button=document.createElement("button");button.type="button";button.className="milestone-button"+(milestone.code===activeMilestoneCode?" active":"");button.innerHTML='<span>'+escapeHtml(milestone.name)+'</span><small>'+visibleCount+'/'+milestone.statusSummary.total+'</small>';button.addEventListener("click",()=>{activeMilestoneCode=milestone.code;render()});milestoneNav.appendChild(button)}}
    function renderActiveMilestone(){fieldIdCounter=0;const milestone=data.milestones.find(item=>item.code===activeMilestoneCode)||data.milestones[0];if(!milestone)return;const q=normalize(search.value.trim());const rows=flattenMilestone(milestone).filter(row=>matches(row,q));activeTitle.textContent=milestone.name;activeGoal.textContent=milestone.goal;activeBadges.innerHTML=badge(milestone.statusSummary.created+" created","created")+badge(milestone.statusSummary.planned+" planned","planned")+badge(milestone.statusSummary.pending+" pending","pending");taskList.innerHTML="";if(!rows.length){taskList.innerHTML='<div class="empty">当前 milestone 没有匹配搜索条件的任务。</div>';return}for(const row of rows)taskList.appendChild(renderTask(row))}
    function renderTask(row){const task=row.task;const details=document.createElement("details");details.className="task";details.innerHTML='<summary><span class="task-title"><span class="chevron">›</span><span class="task-code">'+escapeHtml(task.code)+'</span><span>'+escapeHtml(task.title)+'</span></span><span class="badges">'+badge(row.group.code,"")+badge(task.linearId||statusLabel(task.status),task.status)+'</span></summary>'+editorHtml(task);details.querySelectorAll("[data-field]").forEach(input=>{input.addEventListener("input",()=>updateTaskFromEditor(task,details));input.addEventListener("change",()=>updateTaskFromEditor(task,details))});details.querySelector("[data-action='save']").addEventListener("click",persist);details.querySelector("[data-action='duplicate']").addEventListener("click",()=>duplicateTask(row.group,task));return details}
    function editorHtml(task){return '<div class="task-editor">'+field("状态",'<select data-field="status"><option value="created" '+selected(task.status,"created")+'>created</option><option value="planned" '+selected(task.status,"planned")+'>planned</option><option value="pending" '+selected(task.status,"pending")+'>pending</option></select>')+field("Linear ID",'<input data-field="linearId" type="text" value="'+escapeAttr(task.linearId||"")+'" placeholder="例如 AOA-409" />')+field("任务编号",'<input data-field="code" type="text" value="'+escapeAttr(task.code)+'" />')+field("标题",'<input data-field="title" type="text" value="'+escapeAttr(task.title)+'" />')+field("目标",'<textarea data-field="goal">'+escapeHtml(task.goal||"")+'</textarea>',true)+field("范围",'<textarea data-field="scope">'+escapeHtml(arrayToText(task.scope))+'</textarea>')+field("权限与边界",'<textarea data-field="boundary">'+escapeHtml(task.boundary||"")+'</textarea>')+field("验收标准",'<textarea data-field="acceptance">'+escapeHtml(arrayToText(task.acceptance))+'</textarea>')+field("验证证据",'<textarea data-field="evidence">'+escapeHtml(arrayToText(task.evidence))+'</textarea>')+'<div class="editor-actions"><span class="save-note">修改后点击保存，会写回 tasks.json。</span><span><button type="button" data-action="duplicate">复制任务</button> <button type="button" class="primary" data-action="save">保存</button></span></div></div>'}
    function updateTaskFromEditor(task,root){for(const input of root.querySelectorAll("[data-field]")){const fieldName=input.dataset.field;if(["scope","acceptance","evidence"].includes(fieldName))task[fieldName]=textToArray(input.value);else task[fieldName]=input.value.trim();if(fieldName==="linearId"&&!task[fieldName])task[fieldName]=null}dirty=true;document.getElementById("saveAll").textContent="SAVE *"}
    function duplicateTask(group,task){const copy=cloneData(task);copy.linearId=null;copy.status="pending";copy.code=nextCode(group,task.code);copy.title=copy.title+" Copy";group.children.push(copy);dirty=true;render()}
    function nextCode(group,code){const base=String(code).replace(/\d+$/,'');const nums=(group.children||[]).map(t=>String(t.code).match(/(\d+)$/)).filter(Boolean).map(m=>Number(m[1]));return base+(Math.max(0,...nums)+1)}
    function flattenMilestone(milestone){const rows=[];for(const group of milestone.groups||[])for(const task of group.children||[])rows.push({milestone,group,task});return rows}
    function matches(row,q){if(!q)return true;return normalize([row.milestone.name,row.group.code,row.group.title,row.task.linearId,row.task.status,row.task.code,row.task.title,row.task.goal,row.task.boundary,...(row.task.scope||[]),...(row.task.acceptance||[]),...(row.task.evidence||[])].join(" ")).includes(q)}
    function metric(value,title){return '<div class="metric"><strong>'+escapeHtml(value)+'</strong><span>'+escapeHtml(title)+'</span></div>'}
    function badge(text,kind){return '<span class="badge '+escapeAttr(kind||"")+'">'+escapeHtml(text)+'</span>'}
    function field(labelText,html,full){const id="task-field-"+(++fieldIdCounter);const labeledHtml=html.replace(/<(input|textarea|select)\b/,'<$1 id="'+id+'" aria-label="'+escapeAttr(labelText)+'"');return '<div class="field '+(full?"full":"")+'"><label for="'+id+'">'+escapeHtml(labelText)+'</label>'+labeledHtml+'</div>'}
    function selected(value,target){return value===target?"selected":""}
    function statusLabel(status){return status==="created"?"已创建":status==="planned"?"规划中":"待拆分"}
    function arrayToText(value){return Array.isArray(value)?value.join("\n"):(value||"")}
    function textToArray(value){return value.split("\n").map(item=>item.trim()).filter(Boolean)}
    function cloneData(value){return JSON.parse(JSON.stringify(value))}
    function normalize(value){return String(value||"").toLowerCase()}
    function escapeHtml(value){return String(value??"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]))}
    function escapeAttr(value){return escapeHtml(value)}
    search.addEventListener("input",()=>{if(data)render()});
    document.getElementById("saveAll").addEventListener("click",persist);
    document.getElementById("resetLocal").addEventListener("click",async()=>{if(!confirm("确认丢弃当前页面修改，重新读取 tasks.json？"))return;localStorage.removeItem(backupKey);await boot()});
    document.getElementById("exportJson").addEventListener("click",()=>{if(!data)return;updateSummaries();const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="projectm-task-management.json";a.click();URL.revokeObjectURL(url)});
  </script>
</body>
</html>
